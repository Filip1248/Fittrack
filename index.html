<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitTrack AI - Gym Tracker</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#121212',
                        cardbg: '#1e1e1e',
                        accent: '#3b82f6',
                        accenthover: '#2563eb'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkbg text-gray-100 font-sans antialiased min-h-screen pb-20">

    <!-- Header -->
    <header class="bg-cardbg border-b border-gray-800 sticky top-0 z-50 px-4 py-3 flex justify-between items-center shadow-md">
        <h1 class="text-xl font-bold tracking-wider text-accent flex items-center gap-2">
            💪 FitTrack <span class="text-xs bg-accent/20 text-accent px-2 py-0.5 rounded-full">AI</span>
        </h1>
        <div class="flex gap-2">
            <button onclick="switchTab('workout')" id="nav-workout" class="px-3 py-1.5 rounded-lg text-sm font-medium bg-accent text-white transition">Tréning</button>
            <button onclick="switchTab('history')" id="nav-history" class="px-3 py-1.5 rounded-lg text-sm font-medium text-gray-400 hover:text-white transition">História</button>
            <button onclick="switchTab('exercises')" id="nav-exercises" class="px-3 py-1.5 rounded-lg text-sm font-medium text-gray-400 hover:text-white transition">Cviky</button>
        </div>
    </header>

    <main class="max-w-md mx-auto p-4">

        <!-- 1. WORKOUT TAB -->
        <section id="tab-workout" class="space-y-4">
            
            <!-- Quick Templates -->
            <div class="bg-cardbg p-4 rounded-2xl border border-gray-800 shadow-sm">
                <h2 class="text-xs uppercase tracking-wider text-gray-400 font-semibold mb-3">Tréningové predlohy (Templates)</h2>
                <div class="grid grid-cols-3 gap-2">
                    <button onclick="loadTemplate('Push Day')" class="bg-gray-800 hover:bg-gray-700 text-xs py-2 px-3 rounded-xl font-medium transition text-center border border-gray-700">🔥 Push Day</button>
                    <button onclick="loadTemplate('Pull Day')" class="bg-gray-800 hover:bg-gray-700 text-xs py-2 px-3 rounded-xl font-medium transition text-center border border-gray-700">⚡ Pull Day</button>
                    <button onclick="loadTemplate('Leg Day')" class="bg-gray-800 hover:bg-gray-700 text-xs py-2 px-3 rounded-xl font-medium transition text-center border border-gray-700">🦵 Leg Day</button>
                </div>
            </div>

            <!-- Active Workout Header -->
            <div class="bg-cardbg p-4 rounded-2xl border border-gray-800 flex justify-between items-center">
                <div>
                    <span class="text-xs text-accent font-semibold uppercase tracking-wider">Aktívny deň</span>
                    <input type="text" id="workout-name" value="Moji tréning" class="bg-transparent text-lg font-bold w-full focus:outline-none border-b border-transparent focus:border-accent">
                </div>
                <button onclick="finishWorkout()" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-xl text-sm font-semibold shadow-md transition flex items-center gap-1">
                    Uložiť tréning
                </button>
            </div>

            <!-- Rest Timer Widget -->
            <div class="bg-cardbg p-3 rounded-2xl border border-gray-800 flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <span class="text-sm">⏱️ Rest Timer:</span>
                    <span id="timer-display" class="font-mono text-lg font-bold text-accent">00:00</span>
                </div>
                <div class="flex gap-1">
                    <button onclick="startTimer(60)" class="bg-gray-800 hover:bg-gray-700 text-xs px-2.5 py-1.5 rounded-lg">60s</button>
                    <button onclick="startTimer(90)" class="bg-gray-800 hover:bg-gray-700 text-xs px-2.5 py-1.5 rounded-lg">90s</button>
                    <button onclick="startTimer(120)" class="bg-gray-800 hover:bg-gray-700 text-xs px-2.5 py-1.5 rounded-lg">120s</button>
                    <button onclick="stopTimer()" class="bg-red-900/40 hover:bg-red-900 text-xs px-2 py-1.5 rounded-lg text-red-300">Stop</button>
                </div>
            </div>

            <!-- Exercises Container -->
            <div id="active-exercises" class="space-y-4">
                <!-- Dynamically injected exercises -->
            </div>

            <!-- Add Exercise Button -->
            <button onclick="openExerciseModal()" class="w-full py-3.5 bg-gray-800 hover:bg-gray-700 border border-gray-700 border-dashed rounded-2xl font-semibold text-sm text-gray-300 transition flex items-center justify-center gap-2">
                ➕ Pridať cvik do tréningu
            </button>
        </section>

        <!-- 2. HISTORY TAB -->
        <section id="tab-history" class="space-y-4 hidden">
            <h2 class="text-lg font-bold">História tréningov</h2>
            <div id="history-list" class="space-y-3">
                <!-- Dynamically loaded history -->
            </div>
        </section>

        <!-- 3. EXERCISES MANAGEMENT TAB -->
        <section id="tab-exercises" class="space-y-4 hidden">
            <div class="bg-cardbg p-4 rounded-2xl border border-gray-800">
                <h2 class="text-md font-bold mb-3">Pridať nový vlastný cvik</h2>
                <div class="space-y-3">
                    <div>
                        <label class="text-xs text-gray-400 block mb-1">Názov cviku</label>
                        <input type="text" id="new-ex-name" placeholder="napr. Bicepsový zdvih s jednoručkami" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-accent">
                    </div>
                    <div>
                        <label class="text-xs text-gray-400 block mb-1">Svalová skupina / Kategória</label>
                        <select id="new-ex-cat" class="w-full bg-gray-900 border border-gray-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-accent">
                            <option value="push">Push (Tlaky)</option>
                            <option value="pull">Pull (Ťahy)</option>
                            <option value="legs">Legs (Nohy)</option>
                            <option value="core">Core / Ostatné</option>
                        </select>
                    </div>
                    <button onclick="addNewCustomExercise()" class="w-full bg-accent hover:bg-accenthover text-white py-2 rounded-xl text-sm font-semibold transition">Uložiť nový cvik</button>
                </div>
            </div>

            <div class="bg-cardbg p-4 rounded-2xl border border-gray-800">
                <h2 class="text-md font-bold mb-3">Zoznam všetkých cvikov</h2>
                <div id="all-exercises-list" class="space-y-4 text-sm">
                    <!-- Dynamically populated list with delete buttons -->
                </div>
            </div>
        </section>

    </main>

    <!-- EXERCISE SELECTION MODAL -->
    <div id="exercise-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-cardbg w-full max-w-md rounded-2xl border border-gray-800 p-5 space-y-4 max-h-[85vh] flex flex-col">
            <div class="flex justify-between items-center">
                <h3 class="font-bold text-lg">Vyber cvik</h3>
                <button onclick="closeExerciseModal()" class="text-gray-400 hover:text-white text-xl font-bold">&times;</button>
            </div>
            <!-- Muscle Group Tabs -->
            <div class="flex gap-1 bg-gray-900 p-1 rounded-xl text-xs font-medium">
                <button onclick="filterModalCategory('push')" id="mcat-push" class="flex-1 py-2 rounded-lg bg-accent text-white transition">Push</button>
                <button onclick="filterModalCategory('pull')" id="mcat-pull" class="flex-1 py-2 rounded-lg text-gray-400 hover:text-white transition">Pull</button>
                <button onclick="filterModalCategory('legs')" id="mcat-legs" class="flex-1 py-2 rounded-lg text-gray-400 hover:text-white transition">Legs</button>
                <button onclick="filterModalCategory('core')" id="mcat-core" class="flex-1 py-2 rounded-lg text-gray-400 hover:text-white transition">Core</button>
            </div>
            <!-- Exercise Options List -->
            <div id="modal-exercises-list" class="overflow-y-auto space-y-2 flex-1 pr-1">
                <!-- Dynamically loaded options -->
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // Default exercises database
        const defaultExercises = {
            push: [
                "Bench Press", "Incline DB Press", "OHP (Military Press)", 
                "Dumbbell Lateral Raises", "Cable Lateral Raises", 
                "Triceps Pushdown", "Skullcrushers", "Chest Dips", "Hack Squat (Push focus)"
            ],
            pull: [
                "Lat Pulldown", "Barbell Row", "Seated Cable Row", 
                "Single-Arm DB Row", "Face Pulls", "Incline DB Curl", 
                "Barbell Bicep Curl", "Hammer Curls", "Chin-ups"
            ],
            legs: [
                "Hack Squat", "Romanian Deadlift (RDL)", "Leg Press", 
                "Leg Extension", "Seated Leg Curl", "Standing Calf Raises", 
                "Bulgarian Split Squats", "Goblet Squat"
            ],
            core: [
                "Plank", "Cable Crunch", "Hanging Leg Raises", "Ab Wheel Rollout"
            ]
        };

        // Load exercises from localStorage or defaults
        let exercises = JSON.parse(localStorage.getItem('fittrack_exercises')) || defaultExercises;

        // Templates configuration
        const templates = {
            "Push Day": ["Incline DB Press", "Overhead Press", "Cable Lateral Raises", "Triceps Pushdown"],
            "Pull Day": ["Lat Pulldown", "Seated Cable Row", "Face Pulls", "Incline DB Curl"],
            "Leg Day": ["Hack Squat", "Romanian Deadlift (RDL)", "Leg Extension", "Seated Leg Curl"]
        };

        let activeWorkout = {
            name: "Tréning",
            exercises: [] // Array of { name, sets: [{ weight, reps, rpe }] }
        };

        let currentModalCategory = 'push';
        let timerInterval = null;

        // --- NAVIGATION TABS ---
        function switchTab(tabId) {
            document.getElementById('tab-workout').classList.add('hidden');
            document.getElementById('tab-history').classList.add('hidden');
            document.getElementById('tab-exercises').classList.add('hidden');
            
            document.getElementById('nav-workout').className = "px-3 py-1.5 rounded-lg text-sm font-medium text-gray-400 hover:text-white transition";
            document.getElementById('nav-history').className = "px-3 py-1.5 rounded-lg text-sm font-medium text-gray-400 hover:text-white transition";
            document.getElementById('nav-exercises').className = "px-3 py-1.5 rounded-lg text-sm font-medium text-gray-400 hover:text-white transition";

            document.getElementById('tab-' + tabId).classList.remove('hidden');
            document.getElementById('nav-' + tabId).className = "px-3 py-1.5 rounded-lg text-sm font-medium bg-accent text-white transition";

            if (tabId === 'history') renderHistory();
            if (tabId === 'exercises') renderAllExercisesList();
        }

        // --- WORKOUT LOGIC ---
        function renderActiveWorkout() {
            const container = document.getElementById('active-exercises');
            document.getElementById('workout-name').value = activeWorkout.name;
            
            if (activeWorkout.exercises.length === 0) {
                container.innerHTML = `
                    <div class="bg-cardbg p-8 rounded-2xl border border-gray-800 text-center text-gray-500">
                        Zatiaľ žiadne cviky. Vyber predlohu alebo pridaj cvik.
                    </div>
                `;
                return;
            }

            container.innerHTML = activeWorkout.exercises.map((ex, exIndex) => `
                <div class="bg-cardbg p-4 rounded-2xl border border-gray-800 space-y-3">
                    <div class="flex justify-between items-center">
                        <h3 class="font-bold text-md text-accent">${ex.name}</h3>
                        <button onclick="removeExerciseFromWorkout(${exIndex})" class="text-gray-500 hover:text-red-400 text-xs px-2 py-1">Odstrániť</button>
                    </div>

                    <div class="space-y-2">
                        <div class="grid grid-cols-12 gap-1 text-xs text-gray-400 font-semibold px-1">
                            <span class="col-span-2 text-center">Séria</span>
                            <span class="col-span-3 text-center">Váha (kg)</span>
                            <span class="col-span-3 text-center">Opak.</span>
                            <span class="col-span-3 text-center">RPE</span>
                            <span class="col-span-1"></span>
                        </div>
                        ${ex.sets.map((set, setIndex) => `
                            <div class="grid grid-cols-12 gap-1 items-center bg-gray-900/60 p-1.5 rounded-xl border border-gray-800/80">
                                <span class="col-span-2 text-center font-bold text-sm text-gray-400">${setIndex + 1}</span>
                                <input type="number" step="0.5" value="${set.weight}" onchange="updateSet(${exIndex}, ${setIndex}, 'weight', this.value)" class="col-span-3 bg-gray-900 text-center py-1.5 rounded-lg border border-gray-700 text-sm focus:outline-none focus:border-accent font-semibold">
                                <input type="number" value="${set.reps}" onchange="updateSet(${exIndex}, ${setIndex}, 'reps', this.value)" class="col-span-3 bg-gray-900 text-center py-1.5 rounded-lg border border-gray-700 text-sm focus:outline-none focus:border-accent font-semibold">
                                <input type="number" step="0.5" max="10" min="5" value="${set.rpe}" onchange="updateSet(${exIndex}, ${setIndex}, 'rpe', this.value)" class="col-span-3 bg-gray-900 text-center py-1.5 rounded-lg border border-gray-700 text-sm focus:outline-none focus:border-accent font-semibold text-accent">
                                <button onclick="removeSet(${exIndex}, ${setIndex})" class="col-span-1 text-gray-500 hover:text-red-400 text-center font-bold">&times;</button>
                            </div>
                        `).join('')}
                    </div>

                    <button onclick="addSet(${exIndex})" class="w-full py-2 bg-gray-800 hover:bg-gray-700 text-xs font-semibold rounded-xl text-gray-300 transition">
                        + Pridať sériu
                    </button>
                </div>
            `).join('');
        }

        function loadTemplate(templateName) {
            activeWorkout.name = templateName;
            const exNames = templates[templateName] || [];
            activeWorkout.exercises = exNames.map(name => ({
                name: name,
                sets: [
                    { weight: getLastWeight(name), reps: 10, rpe: 8 },
                    { weight: getLastWeight(name), reps: 10, rpe: 8 },
                    { weight: getLastWeight(name), reps: 10, rpe: 9 }
                ]
            }));
            renderActiveWorkout();
        }

        function getLastWeight(exerciseName) {
            const history = JSON.parse(localStorage.getItem('fittrack_history')) || [];
            for (let i = history.length - 1; i >= 0; i--) {
                const foundEx = history[i].exercises.find(e => e.name === exerciseName);
                if (foundEx && foundEx.sets.length > 0) {
                    return foundEx.sets[foundEx.sets.length - 1].weight;
                }
            }
            return 50; // default fallback weight
        }

        function addSet(exIndex) {
            const lastSet = activeWorkout.exercises[exIndex].sets;
            const prevWeight = lastSet.length > 0 ? lastSet[lastSet.length - 1].weight : 50;
            const prevReps = lastSet.length > 0 ? lastSet[lastSet.length - 1].reps : 10;
            const prevRpe = lastSet.length > 0 ? lastSet[lastSet.length - 1].rpe : 8;
            
            activeWorkout.exercises[exIndex].sets.push({ weight: prevWeight, reps: prevReps, rpe: prevRpe });
            renderActiveWorkout();
        }

        function removeSet(exIndex, setIndex) {
            activeWorkout.exercises[exIndex].sets.splice(setIndex, 1);
            renderActiveWorkout();
        }

        function updateSet(exIndex, setIndex, field, value) {
            activeWorkout.exercises[exIndex].sets[setIndex][field] = parseFloat(value) || 0;
        }

        function removeExerciseFromWorkout(exIndex) {
            activeWorkout.exercises.splice(exIndex, 1);
            renderActiveWorkout();
        }

        // --- EXERCISE MODAL ---
        function openExerciseModal() {
            document.getElementById('exercise-modal').classList.remove('hidden');
            filterModalCategory('push');
        }

        function closeExerciseModal() {
            document.getElementById('exercise-modal').classList.add('hidden');
        }

        function filterModalCategory(category) {
            currentModalCategory = category;
            ['push', 'pull', 'legs', 'core'].forEach(cat => {
                const btn = document.getElementById(`mcat-${cat}`);
                if (cat === category) {
                    btn.className = "flex-1 py-2 rounded-lg bg-accent text-white transition";
                } else {
                    btn.className = "flex-1 py-2 rounded-lg text-gray-400 hover:text-white transition";
                }
            });

            const listContainer = document.getElementById('modal-exercises-list');
            const availableExs = exercises[category] || [];

            listContainer.innerHTML = availableExs.map(exName => `
                <button onclick="addExerciseToWorkout('${exName}')" class="w-full text-left bg-gray-900 hover:bg-gray-800 p-3 rounded-xl border border-gray-800 flex justify-between items-center transition">
                    <span class="font-medium text-sm">${exName}</span>
                    <span class="text-accent text-xs font-bold">+ Pridať</span>
                </button>
            `).join('');
        }

        function addExerciseToWorkout(exerciseName) {
            activeWorkout.exercises.push({
                name: exerciseName,
                sets: [
                    { weight: getLastWeight(exerciseName), reps: 10, rpe: 8 },
                    { weight: getLastWeight(exerciseName), reps: 10, rpe: 8 }
                ]
            });
            closeExerciseModal();
            renderActiveWorkout();
        }

        // --- EXERCISES MANAGEMENT (ADD/REMOVE GLOBAL) ---
        function addNewCustomExercise() {
            const nameInput = document.getElementById('new-ex-name');
            const catSelect = document.getElementById('new-ex-cat');
            const name = nameInput.value.trim();
            const cat = catSelect.value;

            if (!name) {
                alert("Zadaj názov cviku!");
                return;
            }

            if (!exercises[cat]) exercises[cat] = [];
            if (exercises[cat].includes(name)) {
                alert("Tento cvik už v tejto kategórii existuje!");
                return;
            }

            exercises[cat].push(name);
            localStorage.setItem('fittrack_exercises', JSON.stringify(exercises));
            nameInput.value = "";
            renderAllExercisesList();
            alert("Cvik úspešne pridaný!");
        }

        function renderAllExercisesList() {
            const container = document.getElementById('all-exercises-list');
            const cats = { push: 'Push (Tlaky)', pull: 'Pull (Ťahy)', legs: 'Legs (Nohy)', core: 'Core / Ostatné' };

            container.innerHTML = Object.keys(cats).map(catKey => `
                <div class="space-y-1.5 border-b border-gray-800 pb-3">
                    <h3 class="text-xs uppercase tracking-wider text-accent font-semibold">${cats[catKey]}</h3>
                    <div class="space-y-1">
                        ${(exercises[catKey] || []).map(ex => `
                            <div class="flex justify-between items-center bg-gray-900 px-3 py-2 rounded-xl border border-gray-800">
                                <span>${ex}</span>
                                <button onclick="deleteGlobalExercise('${catKey}', '${ex}')" class="text-gray-500 hover:text-red-400 text-xs font-bold px-2 py-0.5">❌ Zmazať</button>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        function deleteGlobalExercise(category, exerciseName) {
            if (confirm(`Naozaj chceš vymazať cvik "${exerciseName}" zo zoznamu?`)) {
                exercises[category] = exercises[category].filter(e => e !== exerciseName);
                localStorage.setItem('fittrack_exercises', JSON.stringify(exercises));
                renderAllExercisesList();
            }
        }

        // --- FINISH & SAVE WORKOUT ---
        function finishWorkout() {
            if (activeWorkout.exercises.length === 0) {
                alert("Tréning neobsahuje žiadne cviky!");
                return;
            }

            activeWorkout.name = document.getElementById('workout-name').value;
            activeWorkout.date = new Date().toLocaleDateString('sk-SK', { day: 'numeric', month: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit' });

            let history = JSON.parse(localStorage.getItem('fittrack_history')) || [];
            history.unshift(activeWorkout);
            localStorage.setItem('fittrack_history', JSON.stringify(history));

            alert("Tréning bol úspešne uložený!");
            
            // Reset active workout
            activeWorkout = { name: "Moji tréning", exercises: [] };
            renderActiveWorkout();
            switchTab('history');
        }

        // --- HISTORY TAB ---
        function renderHistory() {
            const historyContainer = document.getElementById('history-list');
            const history = JSON.parse(localStorage.getItem('fittrack_history')) || [];

            if (history.length === 0) {
                historyContainer.innerHTML = `
                    <div class="bg-cardbg p-8 rounded-2xl border border-gray-800 text-center text-gray-500">
                        Zatiaľ žiadne uložené tréningy.
                    </div>
                `;
                return;
            }

            historyContainer.innerHTML = history.map((workout, index) => `
                <div class="bg-cardbg p-4 rounded-2xl border border-gray-800 space-y-2">
                    <div class="flex justify-between items-center border-b border-gray-800 pb-2">
                        <h3 class="font-bold text-md text-accent">${workout.name}</h3>
                        <span class="text-xs text-gray-500">${workout.date}</span>
                    </div>
                    <div class="space-y-2 text-sm pt-1">
                        ${workout.exercises.map(ex => `
                            <div>
                                <span class="font-semibold text-gray-300">${ex.name}:</span>
                                <div class="text-xs text-gray-400 pl-2">
                                    ${ex.sets.map((s, i) => `Séria ${i+1}: ${s.weight}kg × ${s.reps} op. (RPE ${s.rpe})`).join(' | ')}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `).join('');
        }

        // --- REST TIMER ---
        let timerSeconds = 0;
        function startTimer(seconds) {
            clearInterval(timerInterval);
            timerSeconds = seconds;
            updateTimerDisplay();
            
            timerInterval = setInterval(() => {
                timerSeconds--;
                if (timerSeconds <= 0) {
                    clearInterval(timerInterval);
                    timerSeconds = 0;
                    alert("Čas odpočinku uplynul!");
                }
                updateTimerDisplay();
            }, 1000);
        }

        function stopTimer() {
            clearInterval(timerInterval);
            timerSeconds = 0;
            updateTimerDisplay();
        }

        function updateTimerDisplay() {
            const m = Math.floor(timerSeconds / 60).toString().padStart(2, '0');
            const s = (timerSeconds % 60).toString().padStart(2, '0');
            document.getElementById('timer-display').innerText = `${m}:${s}`;
        }

        // Initial render on load
        window.onload = function() {
            renderActiveWorkout();
        };
    </script>
</body>
</html>
